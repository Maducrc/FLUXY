<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/telaInicial.css">

<body>
    <div class="container-fluid">
        <div class="row vh-100">
            <div class="col-5 esquerda">
                <img src="img/IMG1TI.png" alt="Ilustração">
            </div>

            <div class="col-7 direita d-flex justify-content-center align-items-center">

                <img src="img/logo.png" class="logo" alt="Fluxy">   

                <div class="central">
                    <div class="recep">
                        <div class="titulo">
                        Bem-vindo(a) de volta
                        </div>

                        <div class="Subtitulo">
                        Acompanhe as novidades e mantenha sua equipe sempre conectada.
                        </div>
                    </div>


                    <form>
                        <label>Usuário</label>
                        <div class="input-box">
                            <i class="bi bi-person-fill"></i>
                            <input type="text" placeholder="Digite seu Usuário">
                        </div>

                        <label>Senha</label>
                        <div class="input-box">
                            <i class="bi bi-lock-fill"></i>
                            <input type="password" placeholder="Digite sua Senha">
                            <i class="bi bi-eye-slash-fill" id="toggleSenha"></i>
                        </div>

                        <button type="submit">Login</button>
                    </form>
                </div>

            </div>
        </div>
    </div>
</body>
